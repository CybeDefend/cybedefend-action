name: 'CybeDefend Action'
description: 'Run security scans with CybeDefend directly in your GitHub Actions workflows'
author: 'CybeDefend'
inputs:
  pat:
    description: 'Personal Access Token (PAT) — create one in Account Settings → Personal Access Tokens'
    required: true
  project_id:
    description: 'Project ID for the scan'
    required: true
  wait:
    description: 'Wait for scan completion'
    required: false
    default: 'true'
  interval:
    description: 'Interval in seconds between status checks when waiting for scan completion'
    required: false
    default: '5'
  break_on_fail:
    description: 'Exit with error code if scan fails'
    required: false
    default: 'false'
  break_on_severity:
    description: 'Exit with error code if vulnerabilities of specified severity or above are detected (critical, high, medium, low, none)'
    required: false
    default: ''
  region:
    description: 'Region to use for API endpoints (us, eu). Sets CYBEDEFEND_REGION and is ignored if api_url is provided.'
    required: false
    default: ''
  api_url:
    description: 'Custom API base URL, https only (e.g. https://api.cybedefend.internal). Takes precedence over region and environment variables. On CybeDefend cloud prefer region, which resolves this address for you.'
    required: false
    default: ''
  auth_url:
    description: 'Self-hosted deployments only. Auth endpoint URL of your own instance, https only (e.g. https://auth.cybedefend.internal), set alongside api_url. On CybeDefend cloud use region instead: it resolves the API and auth addresses for you, and setting auth_url there can only get them out of step.'
    required: false
    default: ''
  branch:
    description: 'Branch name to associate with the scan (e.g., main, develop, feature/my-feature)'
    required: true
    default: 'main'
  policy_check:
    description: 'Enable/disable policy evaluation after scan'
    required: false
    default: 'true'
  policy_timeout:
    description: 'Timeout in seconds for policy evaluation'
    required: false
    default: '300'
  show_policy_vulns:
    description: 'Show affected vulnerabilities in policy evaluation output'
    required: false
    default: 'true'
  show_all_policy_vulns:
    description: 'Show all affected vulnerabilities without limit (default shows max 5 per violation)'
    required: false
    default: 'false'
  report_format:
    description: 'Report to export after the scan (none, sarif, json, html, markdown). Use sarif to feed github/codeql-action/upload-sarif.'
    required: false
    default: 'none'
  report_type:
    description: 'Scan types to include in the report (all, sast, sca, iac, secret, cicd, container)'
    required: false
    default: 'all'
  report_filename:
    description: 'Report file name, written into the workspace. Defaults to cybedefend-results.<ext> for the chosen format. Must be a plain file name, without a path.'
    required: false
    default: ''
outputs:
  report_file:
    description: 'Path of the exported report, relative to the workspace — ready to hand to upload-sarif or upload-artifact. Only set when report_format is not none and the export succeeded.'
  report_format:
    description: 'Format actually exported, for conditional steps'
  debug:
    description: 'Print the CLI diagnostics: the credential source, the API and auth endpoints, the client application and the token resource. Turn this on when authentication fails in CI.'
    required: false
    default: 'false'
runs:
  using: 'docker'
  image: 'Dockerfile'
branding:
  icon: 'shield'
  color: 'blue'
