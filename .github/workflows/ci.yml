name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  entrypoint:
    name: entrypoint.sh (shellcheck + bats)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck and bats
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck bats

      - name: Lint entrypoint
        run: shellcheck --shell=sh entrypoint.sh

      # /bin/sh is dash on the runner: the strict POSIX shell the container uses.
      - name: Test entrypoint (dash)
        run: bats tests/

      - name: Test entrypoint (bash in POSIX mode)
        run: SH=/bin/bash bats tests/
